<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HTML Assignment 3</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Center-aligned Heading -->
  <h1 style="text-align:center;">HTML Assignment #3</h1>

  <!-- Table 1 -->
  <table class="middle" id="table1">
    <thead>
      <tr>
        <th id="t1c1">Column 1</th>
        <th id="t1c2">Column 2</th>
        <th id="t1c3">Column 3</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td id="t1r1c1">Row 1, Col 1</td>
        <td id="t1r1c2">Row 1, Col 2</td>
        <td id="t1r1c3">Row 1, Col 3</td>
      </tr>
      <tr>
        <td id="t1r2c1">Row 2, Col 1</td>
        <td id="t1r2c2">Row 2, Col 2</td>
        <td id="t1r2c3">Row 2, Col 3</td>
      </tr>
      <tr>
        <td id="t1r3c1">Row 3, Col 1</td>
        <td id="t1r3c2">Row 3, Col 2</td>
        <td id="t1r3c3">Row 3, Col 3</td>
      </tr>
    </tbody>
  </table>

  <!-- Table 2 -->
  <table class="middle" id="table2">
    <thead>
      <tr>
        <th>Header A</th>
        <th>Header B</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Data A1</td>
        <td>Data B1</td>
      </tr>
      <tr>
        <td>Data A2</td>
        <td>Data B2</td>
      </tr>
    </tbody>
  </table>

  <!-- Table 3 -->
  <table class="middle" id="table3">
    <thead>
      <tr>
        <th>Item</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Item 1</td>
        <td>First description</td>
      </tr>
      <tr>
        <td>Item 2</td>
        <td>Second description</td>
      </tr>
    </tbody>
  </table>

  <script type="text/javascript" src="./script.js"></script>
</body>
</html>
